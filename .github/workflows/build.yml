name: Auto-Compile DNS Blocklists

on:
  push:
    paths:
      - 'src/**'
      - 'build.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Compile Blocklists
        run: python build.py

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compile DNS blocklists [skip ci]"
          file_pattern: "dist/*.txt"
