name: Sync and Compile Blocklists

on:
  schedule:
    # Runs every day at 03:00 UTC
    - cron: '0 3 * * *'
  push:
    paths:
      - 'src/**'
      - 'build.py'
      - 'populate.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-blocklists:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Latest Recommended Feeds
        run: python populate.py

      - name: Deduplicate and Compile Single Blocklist
        run: python build.py

      - name: Commit and Push Updated Blocklist
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-sync and compile blocklist [skip ci]"
          file_pattern: "dist/blocklist.txt src/*.txt"
